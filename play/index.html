<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ragdoll Riot</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#12151c; --panel:#1b2029; --panel2:#232a36; --line:#2f3847; --text:#dfe6f0; --dim:#8b97a8; --accent:#4cc9f0; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.35 "Segoe UI",system-ui,sans-serif; overflow:hidden; user-select:none; }
  body { display:flex; }
  aside { background:var(--panel); padding:10px; overflow-y:auto; flex:none; }
  #left { width:212px; border-right:1px solid var(--line); }
  #right { width:270px; border-left:1px solid var(--line); }
  main { flex:1; position:relative; min-width:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:crosshair; }
  #gl { display:none; }
  h1 { font-size:15px; margin:0 0 10px; letter-spacing:.3px; }
  h2 { font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--dim); margin:14px 0 6px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  button, .item { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 4px; font:inherit; cursor:pointer; text-align:center; }
  button:hover, .item:hover { border-color:var(--accent); }
  button.on { background:var(--accent); color:#06222c; border-color:var(--accent); font-weight:600; }
  button.wide { grid-column:1 / -1; }
  .g3 { grid-template-columns:repeat(3, 1fr); }
  .g3 .item { font-size:10px; padding:5px 2px; line-height:1.15; }
  button.danger:hover { border-color:#f94144; color:#f94144; }
  .item { cursor:grab; touch-action:none; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--dim); }
  .item svg, #ghost svg { width:34px; height:34px; fill:var(--accent); stroke:#0b3140; stroke-width:1.5; pointer-events:none; }
  #ghost { position:fixed; left:0; top:0; pointer-events:none; display:none; opacity:.8; z-index:10; margin:-17px 0 0 -17px; }
  details { border:1px solid var(--line); border-radius:6px; margin-bottom:8px; background:var(--panel2); }
  summary { padding:7px 9px; cursor:pointer; font-weight:600; }
  details > div { padding:2px 9px 8px; }
  .row { display:block; margin:7px 0; }
  .rowtop { display:flex; justify-content:space-between; color:var(--dim); font-size:12px; }
  .rowtop .val { color:var(--text); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; margin:2px 0 0; accent-color:var(--accent); }
  .check { display:flex; align-items:center; gap:7px; margin:6px 0; color:var(--dim); font-size:12px; cursor:pointer; }
  select { max-width:165px; }
  select, input[type=color] { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:3px; font:inherit; }
  input[type=color] { width:44px; height:24px; padding:1px; }
  .inline { display:flex; justify-content:space-between; align-items:center; margin:7px 0; color:var(--dim); font-size:12px; }
  #hud { position:absolute; left:10px; top:8px; color:var(--dim); font-size:12px; pointer-events:none; font-variant-numeric:tabular-nums; }
  #hint { position:absolute; left:50%; transform:translateX(-50%); bottom:10px; max-width:76%; text-align:center; color:var(--text); font-size:12px; pointer-events:none; background:#0b0e13cc; border:1px solid var(--line); border-radius:14px; padding:5px 14px; }
  body.hideL #left, body.hideR #right { display:none; }
  #topbar .sep { width:1px; height:20px; background:var(--line); margin:0 2px; }
  .item img { image-rendering:auto; }
  .empty { color:var(--dim); font-size:12px; padding:4px 0; }
  /* ---- game layout: tabs, top bar, main menu */
  #left { width:236px; }
  h1 { font-size:18px; font-weight:800; letter-spacing:1px; } h1 span { color:var(--accent); }
  .tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .tabs button { padding:4px 9px; font-size:11px; border-radius:14px; }
  #right { padding:0; display:flex; flex-direction:column; overflow:hidden; }
  #rtabs { padding:8px; margin:0; border-bottom:1px solid var(--line); }
  #rbody { padding:10px; overflow-y:auto; flex:1; }

  .sec h3 { margin:6px 0 4px; font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); }
  #topbar { position:absolute; left:0; right:0; top:0; z-index:3; display:flex; gap:6px; align-items:center; padding:6px 8px 14px; background:linear-gradient(#0b0e13f0,#0b0e1300); pointer-events:none; }
  #topbar button { pointer-events:auto; padding:5px 11px; }
  #score { margin-left:auto; display:flex; gap:6px; }
  .chip { padding:2px 9px; border-radius:10px; color:#fff; font-weight:700; font-size:12px; text-shadow:0 1px 1px #0008; }
  #hud { top:46px; }

  .mcard { width:min(1160px,97vw); height:95vh; max-height:95vh; overflow:auto; background:#131923f5; border:3px solid #07090d; outline:2px solid #303b4d; border-radius:5px; padding:16px 26px 22px; box-shadow:0 24px 90px #000d; }

  .mcb span { font-size:11px; font-weight:400; letter-spacing:1px; text-transform:none; color:#e1e7f0; text-shadow:1px 1px 0 #2a2f38; }
  .mcb:hover:not(:disabled) { background:#7d8fa9; box-shadow:inset 0 3px 0 #c5d2e8, inset 0 -5px 0 #4f5f7a; outline:2px solid #fff; }
  .mcb:active:not(:disabled) { transform:translateY(2px); }
  .mcb.mgold { background:#2f93cc; box-shadow:inset 0 3px 0 #8bd2f8, inset 0 -5px 0 #1d6088; }
  .mcb.mgold:hover:not(:disabled) { background:#3fa8e2; box-shadow:inset 0 3px 0 #a9defb, inset 0 -5px 0 #24709c; }
  .mcb:disabled { background:#393e47; color:#8a92a0; box-shadow:inset 0 3px 0 #535a66, inset 0 -5px 0 #292d34; text-shadow:none; cursor:not-allowed; } .mcb:disabled span { color:#8a92a0; text-shadow:none; }
  .mhead { display:flex; align-items:center; gap:18px; margin-bottom:10px; padding-bottom:10px; border-bottom:2px solid #232c3a; }
  .mwhere { margin-left:auto; font-size:20px; font-weight:800; letter-spacing:3px; text-transform:uppercase; color:var(--dim); }
  .mback { padding:9px 16px; font-weight:800; letter-spacing:1px; border:3px solid #07090d; border-radius:3px; background:#6b7482; color:#fff; box-shadow:inset 0 2px 0 #aab3c1, inset 0 -3px 0 #434a56; }
  .mfoot { position:fixed; left:14px; bottom:10px; color:#c9d2df; font-size:12px; text-shadow:1px 1px 0 #000; pointer-events:none; } .mfootr { left:auto; right:14px; }

  .mpage { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }

  .mbig.on { border-color:var(--accent); }
  .mpage p { margin:2px 0; color:var(--dim); grid-column:1 / -1; } .mpage p b { color:var(--text); }

  .mkind.on, .mbig.on { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .mbig.on span, .mbig.on b, .mkind.on span { color:#06202b; }
  .mrow3 .mbig { padding:9px 12px; }
  .mhero { min-height:210px; justify-content:flex-end; padding:18px; background:linear-gradient(160deg,#1c2c44,#111823); }
  .mhero:hover { background:linear-gradient(160deg,#24406a,#131c2a); }
  .mhero b { font-size:30px; letter-spacing:3px; color:var(--accent); } .mhero span { font-size:13px; }
  .mhero img { width:168px !important; height:119px !important; align-self:center; margin-bottom:auto; }

  body.playing canvas { cursor:crosshair; }
  #hpbar { position:absolute; left:16px; top:50%; transform:translateY(-50%); width:26px; height:min(300px,42vh); background:#2a1114; border:3px solid #07090d; outline:2px solid #303b4d; border-radius:8px; overflow:hidden; display:none; pointer-events:none; }

  body.playing #hpbar, body.playing #hpnum { display:block; }
  #mhud { position:absolute; left:50%; top:46px; transform:translateX(-50%); display:none; pointer-events:none; text-align:center; background:#0b0e13cc; border:1px solid var(--line); border-radius:10px; padding:6px 14px; min-width:340px; white-space:nowrap; }
  #mhud .mh1 { display:flex; gap:16px; justify-content:center; align-items:baseline; font-weight:900; font-size:20px; letter-spacing:1px; }
  #mhud .tr { color:#ff7a7e; } #mhud .tb { color:#7fb2ff; } #mhud .tm { color:#fff; font-size:16px; background:#1b2330; border-radius:6px; padding:1px 8px; }
  #mhud .mh2 { color:var(--dim); font-size:12px; margin-top:2px; }
  #mhud .kbar { position:relative; height:20px; margin-top:6px; background:#2a1114; border:2px solid #07090d; outline:1px solid #ffd166; border-radius:5px; overflow:hidden; } #mhud .kbar i { position:absolute; left:0; top:0; bottom:0; background:linear-gradient(#b3261e,#7a1410); } #mhud .kbar b { position:relative; font-size:12px; letter-spacing:2px; line-height:20px; color:#ffd166; text-shadow:0 1px 2px #000; }
  #mboard { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:none; background:#0b0e13ee; border:2px solid #303b4d; border-radius:10px; padding:14px 20px; min-width:420px; max-height:80vh; overflow:auto; text-align:center; z-index:5; }
  #mboard h2 { margin:0 0 6px; font-size:34px; letter-spacing:3px; } #mboard h3 { margin:0 0 8px; } #mboard p { color:var(--dim); margin:6px 0; }
  #mboard table { width:100%; border-collapse:collapse; text-align:left; } #mboard th { color:var(--dim); font-weight:400; font-size:12px; padding:3px 8px; } #mboard td { padding:4px 8px; border-top:1px solid #222b38; font-weight:700; } #mboard td i { color:var(--dim); font-weight:400; font-size:11px; } #mboard tr.me td { background:#1c2940; }
  #mboard th:not(:first-child), #mboard td:not(:first-child) { text-align:right; }
  .mbtns { display:flex; gap:10px; justify-content:center; margin-top:12px; } .mbtns button { padding:9px 20px; font-size:15px; font-weight:800; }

  .mrow4 { grid-template-columns:repeat(4,1fr); }
  .mbox { background:#0e131b; border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; } .mbox h4 { margin:4px 0 0; font-size:14px; letter-spacing:1px; text-transform:uppercase; color:#cfd8e6; } .mbox p, .mwide p { margin:0; color:var(--dim); font-size:12px; }
  .minp { width:100%; box-sizing:border-box; padding:9px 10px; background:#07090d; color:var(--text); border:1px solid #303b4d; border-radius:6px; font-size:14px; }
  .mbtn { padding:9px 14px; font-weight:700; border-radius:6px; } .mgo2 { background:#2f93cc; color:#fff; font-size:16px; letter-spacing:1px; }
  .mseg { display:grid; grid-template-columns:1fr 1fr; gap:6px; } .mseg button { padding:8px; } .mseg button.on { border-color:var(--accent); background:var(--accent); color:#06202b; }

  .mroom { display:flex; gap:10px; align-items:center; padding:7px 9px; background:#131a25; border-radius:6px; } .mroom b { font-size:14px; } .mroom span { color:var(--dim); font-size:12px; flex:1; }

  .mroomhead { display:flex; gap:14px; align-items:center; padding:10px 14px; background:#0e131b; border:1px solid var(--line); border-radius:10px; } .mroomhead b { font-size:20px; } .mroomhead span { color:var(--dim); flex:1; } .mroomhead code { font-size:26px; font-weight:900; letter-spacing:4px; color:#ffd166; background:#07090d; padding:3px 12px; border-radius:6px; user-select:all; }

  .merr { color:#ff8a8f !important; font-weight:700; }

  .mpick { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--dim); } .mpick select { background:#131a25; color:#e6edf3; border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }

  .mlist { display:flex; flex-direction:column; gap:6px; }
  #phud { position:absolute; left:14px; bottom:14px; display:none; pointer-events:none; min-width:320px; background:#0b0e13cc; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; }

  #phud small { color:var(--dim); display:block; margin-top:5px; }
</style>

<body>

<!-- ======================= PHYSICS CORE (no DOM) ======================= -->
<script>
'use strict';
const MASS_SCALE = 0.001, MAXP = 5000, GM = 200;
const COLORS = ['#f94144','#f8961e','#f9c74f','#90be6d','#43aa8b','#4cc9f0','#7b9acc','#b5179e','#f72585','#a8dadc'];

// Every tweakable option lives here; the right-hand panel is generated from it.
// every bit of chance in the simulation comes from here, so that two computers given the same seed do exactly the same thing
let rngS = (Math['random']()*4294967296)>>>0;
function RNG() { rngS = (rngS+0x6D2B79F5)|0; let t = Math.imul(rngS^(rngS>>>15), 1|rngS); t = (t+Math.imul(t^(t>>>7), 61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }
RNG.seed = n => { rngS = n>>>0; };
const S = {
  gravityY:1000, gravityX:0, timeScale:1, substeps:4, iterations:8, airDrag:0.05,
  walls:true, wallL:true, wallR:true, floor:true, ceiling:false, connectedCollide:true,
  volume:0.6, mute:false, cleanDead:true, newH:1500,
  size:60, density:0.6, friction:0.4, bounce:0.2, spawnStatic:false, randomColor:true, color:'#4cc9f0', nodeSize:9,
  springType:'spring', stiffness:150, damping:3, autoRest:true, restLength:80, centerAnchor:true,
  pourRate:600, waterH:22, waterStiff:20, waterNear:30, waterRho:3, waterVisc:6, waterTension:0.5,
  waterDensity:1, waterCouple:true, waterColor:'#3aa0ff', waterRender:'smooth', liquid:'water', pourSize:16,
  ragStiff:0.4,
  ragAlive:true, ragStrength:1, ragFight:true, ragWalk:true, world:'big', follow:false, team:'lone', brush:'draw', brushSize:240, brushCol:'#3d5a3a', newW:16000, ragType:'human', sleepFar:true, glow:true, physRag:true, planeInvert:false, hurt:true, gore:true, simpleWater:true, sparse:true, gunForce:1, boomPower:1,
  showContacts:false, showVelocity:false,
};
const S0 = JSON.parse(JSON.stringify(S));   // the settings as they come, which a shared game goes back to

let W = 5200, H = 1400, nextId = 1; // size of the world (the screen is a camera looking at part of it)
const bodies = [], springs = [], joints = [], manifolds = [];
let nextGroup = 1;
let selected = null, grab = null;
const mouse = { x:0, y:0, down:false };
let sfx = () => {}, gameEvent = () => {};   // sound and game-event hooks, filled in by the interface

function pickColor() { return S.randomColor ? COLORS[(RNG()*COLORS.length)|0] : S.color; }
function regular(n, r, rot) {
  const v = [];
  for (let i = 0; i < n; i++) { const a = rot + i*2*Math.PI/n; v.push([Math.cos(a)*r, Math.sin(a)*r]); }
  return v;
}
function geom(kind, s) {
  switch (kind) {
    case 'box':   return [[-s/2,-s/2],[s/2,-s/2],[s/2,s/2],[-s/2,s/2]];

const seaY = (l, x) => l.y+2.6*Math.sin(x/150+simT*1.1)+1.2*Math.sin(x/61-simT*1.7);   // the surface, with a gentle swell
function seaForces(dt) {
  let any = false;
  for (const l of lakes) if (l.sea) { any = true; break; }
  if (!any) return;
  const g = S.gravityY*dt;
  for (const b of bodies) {
    if (b.invMass === 0 || b.zz) continue;
    let l = null;
    for (const q of lakes) if (q.sea && b.x > q.x0 && b.x < q.x1) { l = q; break; }
    const top = l ? seaY(l, b.x) : 0;
    if (!l || b.maxy <= top) { b.inSea = false; continue; }
    const f = Math.min(1, (b.maxy-top)/Math.max(4, b.maxy-b.miny));                                                    // how much of it is under
    let rel = Math.min(2.6, 1/Math.max(0.05, b.density));                                                             // and how light it is
    if (b.rag) rel = Math.min(rel, b.rag.alive ? 0.9 : 1.03);
    if (b.item && (b.item.gun || b.item.melee) && !b.item.turret && !b.holder) rel = Math.max(rel, 1.6);                 // weapons float, so you can pick them up out of the water
    if (b.item && b.item.sub && b.driver) rel = 1;                                                                      // a crewed submarine trims itself level in the water                                                           // swimmers hold themselves up; the dead float just under the surface
    if (!b.inSea) {
      b.inSea = true;
      if (b.vy > 420 && !b.limb) { sfx('splash', b.x, top, Math.min(1.6, 0.5+b.mass*0.02)); for (let i = 0; i < 5; i++) { const life = 0.4+RNG()*0.4; addFx({ t:1, c:'#bfe3ff', x:b.x+(RNG()-0.5)*40, y:top, vx:(RNG()-0.5)*300, vy:-180-RNG()*280, life, m:life, r:2.2 }); } }
    }
    b.vy -= g*f*rel;
    b.vy *= 1/(1+dt*3.2*f); b.vx *= 1/(1+dt*1.1*f); b.w *= 1/(1+dt*4*f);
    if (b.item && b.item.boat) { const a = b.a-6.283185307*Math.round(b.a/6.283185307); b.w += (-a*4-b.w)*0.05*f; if (!b.on) b.vx *= 1/(1+dt*7*f); }   // hulls right themselves, and a boat with its engine off sits still in the water
  }
}

// The driver turns it on the nearest enemy by themselves. On the vehicle you drive it follows the mouse and fires with E.
function mountTick(v, d, dt) { const was = hitBy; hitBy = v.driver || hitBy; mountTick0(v, d, dt); hitBy = was; }
function mountTick0(v, d, dt) {
  if (v.mgCool > 0) v.mgCool -= dt;
  if (v.mgTrig > 0) v.mgTrig -= dt;
  const dir = v.dir || 1, home = v.a+(dir > 0 ? 0 : Math.PI), p = v.toWorld(d.mgp[0]*dir, d.mgp[1]);
  if (v.mgA == null) v.mgA = home;
  const C = vctl(v), mine = !!C, live = v.driver && v.driver.alive;
  let tx = null, ty = 0, fire = false;
  if (mine && C.mx != null) { tx = C.mx; ty = C.my; fire = v.mgTrig > 0; }
  else if (live && v.on && S.ragFight) {
    if ((v.mgScan = (v.mgScan || 0)-dt) <= 0) { // look for the nearest enemy a few times a second
      v.mgScan = 0.3; v.mgFoe = null;
      let bd = v.zside ? 3600 : 1500;
      for (const o of ragList) { if (!o.alive || o.seat === v || !hostile(v.driver, o)) continue; const dd = Math.hypot(o.chest.x-p[0], o.chest.y-p[1]); if (dd < bd) { bd = dd; v.mgFoe = o; } }
    }
    const o = v.mgFoe;
    if (o && o.alive) { tx = o.chest.x; ty = o.chest.y; fire = true; }
  }
  let da = (tx == null ? home : Math.atan2(ty-p[1], tx-p[0]))-v.mgA; da -= 6.283185307*Math.round(da/6.283185307);
  v.mgA += Math.max(-5*dt, Math.min(5*dt, da));
  if (!fire || v.mgCool > 0 || Math.abs(da) > 0.15) return;
  const ang = v.mgA+(RNG()-0.5)*0.05, dx = Math.cos(ang), dy = Math.sin(ang), mx = p[0]+dx*15*d.k, my = p[1]+dy*15*d.k;
  let best = v.zside ? 4200 : 2600, hit = null;
  for (const t of bodies) { if (t === v || t.group === v.group || t.holder || t.noShot || (v.zside && t.solid)) continue; const tt = rayBody(t, mx, my, dx, dy, best); if (tt >= 0) { best = tt; hit = t; } }
  if (!mine) { // a driver holds fire when a friend or a wall is in the way
    if (hit && hit.rag && hit.rag.alive && !hostile(v.driver, hit.rag)) { v.mgCool = 0.2; return; }
    if (!(hit && hit.rag) && best < Math.hypot(tx-mx, ty-my)-70) { v.mgCool = 0.2; return; }
  }
  tracers.push({ x1:mx, y1:my, x2:mx+dx*best, y2:my+dy*best, life:0.07, c:d.mgc });
  flashes.push({ x:mx, y:my, r:12, life:0.05, m:0.05 }); sfx(d.mgc ? 'laser' : 'shot', mx, my, 0.8); makeNoise(mx, my);
  if (hit) bulletHit(hit, mx+dx*best, my+dy*best, dx, dy, { imp:50, dmg:d.mgc ? 20 : 15 }, 'vehicle gun');
  v.mgCool = v.zside ? 0.3 : d.mgc ? 0.16 : 0.085;                    // (the dead are slower on the trigger)
}
function frameStep() {
  const sub = S.substeps, dt = (1/60)*S.timeScale/sub;

  if (seaFn) seaStream(focus ? (focus[0][0]+focus[0][1])/2 : player && bodies.includes(player.chest) ? player.chest.x : seaC, dt*sub);
  for (let i = 0; i < sub; i++) step(dt, i%2 === 1 || i === sub-1);

  if (a.resume) boxA.append(el('p', '', 'Saved game: ' + resumeText(a.resume)));
  { const rr = el('div', 'mrowi'); rr.append(inp('New name', 'ren', 16), btn('Rename', () => { const n = (F.ren || '').trim().slice(0, 16); if (!n) F.msg = 'Type the new name first.'; else if (DB.acc[n]) F.msg = 'There is already an account with that name.'; else { delete DB.acc[DB.cur]; a.name = n; DB.acc[n] = a; DB.cur = n; F.ren = ''; dbSave(); } buildMenu(); })); boxA.append(rr); }
  { // the save file for this player
    boxA.append(el('h4', '', 'Save file for ' + a.name));
    const rr = el('div', 'mrowi'), fi = el('input'); fi.type = 'file'; fi.accept = '.rrsave,.json'; fi.style.display = 'none';
    fi.onchange = () => { const f = fi.files && fi.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { saveNow(); const n = saveFileTake(String(rd.result), true); if (n) { DB.cur = n; usePS(); dbSave(); F.msg = 'Loaded ' + n + ' from the file. You are signed in as ' + n + '.'; } else F.msg = 'That is not a Ragdoll Riot save file.'; buildMenu(); }; rd.readAsText(f); };
    rr.append(btn('Save ' + a.name + ' to a file', () => { saveNow(); const u = URL.createObjectURL(new Blob([saveFileOf(DB.cur)], { type:'application/json' })), l = el('a'); l.href = u; l.download = saveFileName(DB.cur); document.body.append(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); }), btn('Load a player from a file', () => fi.click()), fi);
    boxA.append(rr);
    boxA.append(el('p', '', HOST ? 'This player is also saved by itself, every few seconds, as ' + saveFileName(a.name) + ' in the "saves" folder' + (window.rrHostDir ? ' (' + window.rrHostDir + ')' : ' next to the game') + '. Copy that file to another computer and it is picked up when the game starts there.' : 'The file holds this player only: level, records, saved game and leader board runs. Take it to another computer and load it there. A password here only keeps other people in your house out.'));
  }
  boxB.append(el('h4', '', 'Accounts on this computer'));
  for (const n of Object.keys(DB.acc)) {
    const o = DB.acc[n], row = el('div', 'mroom'); row.append(el('b', '', o.name + (n === DB.cur ? ' (signed in)' : '')), el('span', '', 'Level ' + lvl(o) + (o.pw ? ' · password' : '')));
    if (n !== DB.cur) row.append(btn('Sign in', () => { if (o.pw) { F.ask = n; F.pw2 = ''; buildMenu(); } else { saveNow(); DB.cur = n; usePS(); dbSave(); buildMenu(); } }));
    boxB.append(row);
    if (F.ask === n) { const r2 = el('div', 'mrowi'); const go = () => { if (pwHash(F.pw2 || '') === o.pw) { saveNow(); DB.cur = n; usePS(); F.ask = null; dbSave(); } else F.msg = 'Wrong password.'; buildMenu(); }; r2.append(inp('Password for ' + o.name, 'pw2', 40, 'password'), btn('OK', go)); boxB.append(r2); }
  }
  boxB.append(el('h4', '', 'New account'));
  boxB.append(inp('Name', 'name', 16), inp('Password (optional)', 'pw', 40, 'password'));
  boxB.append(btn('Create account', () => {
    const n = (F.name || '').trim().slice(0, 16);
    if (!n) F.msg = 'Type a name first.'; else if (DB.acc[n]) F.msg = 'There is already an account with that name.';
    else { saveNow(); const o = DB.acc[n] = newAcc(n); if (F.pw) o.pw = pwHash(F.pw); DB.cur = n; F.name = F.pw = ''; usePS(); dbSave(); }
    buildMenu();
  }, 'mgo2'));
  if (Object.keys(DB.acc).length > 1) boxB.append(btn('Delete the account I am signed in to', () => { if (accountPage.sure !== DB.cur) { accountPage.sure = DB.cur; F.msg = 'Press it again to delete ' + DB.cur + ' and everything saved with it.'; } else { delete DB.acc[DB.cur]; DB.cur = Object.keys(DB.acc)[0]; accountPage.sure = null; usePS(); dbSave(); } buildMenu(); }));
}
setInterval(saveNow, 4000);
addEventListener('pagehide', saveNow); addEventListener('beforeunload', saveNow);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(); });

// --------------------------------------------------------------------- loop
let last = performance.now(), acc = 0, fps = 60, hudT = 0;
function updateCamera() {
  if (Math.abs(cam2.zt-cam2.z) > 0.0005) { // ease the zoom, keeping the spot under the mouse where it is
    cam2.z += (cam2.zt-cam2.z)*0.22;
    if (zoomAt) { cam2.x = zoomAt.wx-zoomAt.sx/cam2.z; cam2.y = zoomAt.wy-zoomAt.sy/cam2.z; }
  } else zoomAt = null;
  { // with no vehicle selected, the arrow keys and WASD scroll the world (hold Shift to go faster)
    const kx = ctrlVeh || GAME.mode ? 0 : (held.r ? 1 : 0)-(held.l ? 1 : 0), ky = ctrlVeh || GAME.mode ? 0 : (held.d ? 1 : 0)-(held.u ? 1 : 0), sp = (boost ? 2600 : 1100)/cam2.z;
    cam2.vx += (kx*sp-cam2.vx)*0.18; cam2.vy += (ky*sp-cam2.vy)*0.18;
    if (Math.abs(cam2.vx)+Math.abs(cam2.vy) > 1) { cam2.x += cam2.vx/60; cam2.y += cam2.vy/60; zoomAt = null; if (kx || ky) followHold = performance.now()+2500; }
  }
  const z = cam2.z, vw = VW/z, vh = VH/z;
  const fol = GAME.mode ? (player && bodies.includes(player.chest) ? player.seat || player.chest : null) : ctrlVeh && ctrlVeh.on ? ctrlVeh : S.follow && selected instanceof Body && bodies.includes(selected) ? selected : null;   // the camera rides along with the vehicle you are driving
  if (fol && !orbit && performance.now() > followHold) {
    const lx = GAME.mode && mouse.sx != null ? (mouse.sx-VW/2)/z*0.25 : 0, ly = GAME.mode && mouse.sy != null ? (mouse.sy-VH/2)/z*0.2 : 0;   // playing: the view leans toward where you are aiming
    cam2.x += (fol.x+fol.vx*0.32+lx-vw/2-cam2.x)*0.12; cam2.y += (fol.y+fol.vy*0.15+ly-vh*0.58-cam2.y)*0.12;   // looking a little ahead of where it is going
  } else if (mouse.down && (grab || pending)) { // dragging something to the edge of the screen scrolls the view
    const m = 36, sp = 14/z;
    if (mouse.sx < m) cam2.x -= sp; else if (mouse.sx > VW-m) cam2.x += sp;
    if (mouse.sy < m) cam2.y -= sp; else if (mouse.sy > VH-m) cam2.y += sp;
  }
  cam2.x = vw >= W+500 ? (W-vw)/2 : Math.max(-250, Math.min(W+250-vw, cam2.x));
  cam2.y = Math.max(-28000, Math.min(H+140-vh, cam2.y));
  if (mouse.sx != null) { const q = screenToSim(mouse.sx, mouse.sy); mouse.x = q[0]; mouse.y = q[1]; }
}
function loop(now) {
  const real = Math.min(0.1, (now-last)/1000); last = now;
  fps += (1/Math.max(real, 1e-3)-fps)*0.05;
  { // the vehicle you have selected is the one the keys drive
    const sb = selected instanceof Body ? (selected.owner || selected) : null;
    const cv = GAME.mode ? (player && player.alive && player.passenger == null && player.seat) || null : sb && sb.item && sb.item.veh && bodies.includes(sb) ? sb : null;   // playing: the one you are sitting in
    if (GAME.mode) { pin.l = !!held.l; pin.r = !!held.r; pin.jump = !!held.u || !!held.sp; pin.fire = !!mouse.down && !menuOpen; pin.fire2 = !!mouse.down2 && !menuOpen; }
    if (cv !== ctrlVeh) { ctrlVeh = cv; updateHint(); }
  }
  if (tool === 'terrain' && mouse.down && !mmDrag) terrainEdit(mouse.x, mouse.y, S.brush, S.brushSize, S.brushCol);
  applyTerrain();
  updateCamera();
  if (grab && grab.body.holder) { // yank hard on a held weapon to pull it out of the ragdoll's hand
    const q = grab.body.toWorld(grab.lx, grab.ly);
    if (Math.hypot(mouse.x-q[0], mouse.y-q[1]) > 150) dropGun(grab.body);
  }
  if (grab && grab.body.rag && grab.body.rag.seat) { // yank hard on a driver to pull them out
    const q = grab.body.toWorld(grab.lx, grab.ly);
    if (Math.hypot(mouse.x-q[0], mouse.y-q[1]) > 150) { unseat(grab.body.rag.seat); grab.yanked = true; }
  }
  // pinned or paused shapes follow the mouse directly
  if (grab && (paused || grab.body.invMass === 0)) {
    const b = grab.body, c = Math.cos(b.a), s = Math.sin(b.a);
    b.x = mouse.x-(c*grab.lx-s*grab.ly); b.y = mouse.y-(s*grab.lx+c*grab.ly); b.vx = b.vy = b.w = 0; b.update();
  }
  if (S.sleepFar) { // the part of the world on screen (and a margin), your vehicle and whatever is selected stay awake
    const vw = VW/cam2.z; focus = [[cam2.x-700, cam2.x+vw+700]];
    if (ctrlVeh) focus.push([ctrlVeh.x-1500, ctrlVeh.x+1500]);
    if (selected instanceof Body) focus.push([selected.x-900, selected.x+900]);
    if (GAME.mode && player && bodies.includes(player.chest)) focus.push([player.chest.x-2600, player.chest.x+2600]);
  } else focus = null;
  if (GAME.net) netFrame(real);
  else if (!paused && !(GAME.mode && menuOpen)) {
    acc += real; let steps = 0;
    while (acc >= 1/60 && steps < 3) {
      thrKey = ctrlVeh && ctrlVeh.item.plane ? (held.e ? 1 : 0)-(held.q ? 1 : 0) : 0;
      if (ctrlVeh && (GAME.mode ? pin.fire || pin.fire2 : ctrlVeh.item.plane ? held.x : held.e)) vehFire(ctrlVeh);
      if (tool === 'water' && mouse.down && !mmDrag) {
        pourAcc += S.pourRate/60; const c = pourAcc|0; pourAcc -= c; emitWater(mouse.x, mouse.y, c);
      }
      if (useTarget && useTarget.item && useTarget.item.gun && useTarget.item.auto && bodies.includes(useTarget)) activate(useTarget);
      frameStep(); acc -= 1/60; steps++;
    }
    if (acc > 0.1) acc = 0;
  }
  if (selected !== lastSel) { lastSel = selected; buildInspector(); }
  draw();
  // screen shake from explosions
  const sh = shake > 0.4 ? `translate(${((Math.random()-0.5)*shake).toFixed(1)}px,${((Math.random()-0.5)*shake).toFixed(1)}px)` : '';
  canvas.style.transform = sh; shake *= 0.88;
  { // engine sound: yours, or the nearest one running
    let ev = ctrlVeh && ctrlVeh.on && !ctrlVeh.item.quiet ? ctrlVeh : null;   // (boards, bicycles, skis and gliders make no engine noise)
    if (!ev && !paused) { const cx = cam2.x+VW/cam2.z/2; let bd = 1e9; for (const b of bodies) if (b.item && b.item.veh && b.on && !b.item.custom && !b.item.quiet) { const dd = Math.abs(b.x-cx); if (dd < bd) { bd = dd; ev = b; } } }
    SFX.engine(paused ? null : ev);
  }
  if (GAME.mode && now-(updatePlayHud.t || 0) > 90) { updatePlayHud.t = now; updatePlayHud(); }
  if (now-hudT > 250) {
    hudT = now;
    let fly = '';
    if (ctrlVeh) { const d = ctrlVeh.item; fly = ` · ${d.name.split(' (')[0]}: ${Math.round(Math.hypot(ctrlVeh.vx, ctrlVeh.vy)/75*3.6*5)} km/h` + (d.heli || d.plane ? `, ${Math.max(0, Math.round((groundY(ctrlVeh.x)-ctrlVeh.y-d.bottom)/75))} m up` : '') + (d.mgp ? ' · gun follows the mouse, E fires' : '') + planeTip(ctrlVeh); }
    $('hud').textContent = `${MAPS[S.world].name.split(':')[0]} · ${bodies.filter(b => !b.isWall && !b.terrain).length} things (${bodies.filter(b => b.zz).length} asleep) · ${P.n} water · ${Math.round(fps)} fps${fly}`;
    updateScore();
  }
  requestAnimationFrame(loop);
}

dbLoad(); buildLeft(); buildPanel(); setTool('drag'); resize(); resetWorld(); restoreSand(); resetView(); buildInspector(); ready = true; showMenu(true);
requestAnimationFrame(loop);
</script>
